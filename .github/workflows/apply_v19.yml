name: Apply v19 confirmed daily close

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply_v19.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v19-confirmed-close
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply v19 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scanner.py")
          s = p.read_text(encoding="utf-8")

          assert "SCHEMA_VERSION = 18" in s
          s = s.replace(
              "SCHEMA_VERSION = 18",
              "SCHEMA_VERSION = 19",
              1,
          )

          s = s.replace(
              "historical_close",
              "confirmed_daily_close",
          )

          scan_marker = "\ndef scan(\n"
          assert scan_marker in s

          helper = '''

          def uses_confirmed_daily_close(session: str) -> bool:
              """Use the official daily OHLC, including the closing auction, for close scans."""
              return session == "close"

          '''

          s = s.replace(
              scan_marker,
              helper + scan_marker,
              1,
          )

          old_assignment = (
              'confirmed_daily_close = '
              'effective_date < run_date and session == "close"'
          )
          assert old_assignment in s

          s = s.replace(
              old_assignment,
              'confirmed_daily_close = uses_confirmed_daily_close(session)',
              1,
          )

          s = s.replace(
              "通常実行のnoon/closeは従来どおり5分足を使う。\n"
              "    # 過去日のclose再計算だけは、その日の確定日足を判定用OHLCにする。",
              "noonは指定時刻までの5分足、closeは同日・過去日とも確定日足を使う。\n"
              "    # クロージング・オークションを含む公式終値を反映する。",
              1,
          )

          s = s.replace(
              "過去日closeの判定用当日OHLCは確定日足を使用。",
              "closeの判定用当日OHLCは確定日足を使用。",
              1,
          )

          s = s.replace(
              "判定用当日OHLCはnoon/closeとも5分足から生成。",
              "noonの判定用当日OHLCは5分足から生成。",
              1,
          )

          s = s.replace(
              "1日足は判定には使わず、5分足終値との照合だけに使う。",
              "closeでは確定日足を判定OHLCに使い、noonでは日足は照合用に保持する。",
              1,
          )

          s = s.replace(
              '"confirmed_daily" if confirmed_daily_close else "intraday_5m"',
              '"confirmed_daily_close" if confirmed_daily_close else "intraday_5m"',
              1,
          )

          p.write_text(
              s,
              encoding="utf-8",
          )

          p = Path("test_v14_screening.py")
          s = p.read_text(encoding="utf-8")

          assert "test_schema_is_v18" in s
          assert "scanner.SCHEMA_VERSION, 18" in s

          s = s.replace(
              "test_schema_is_v18",
              "test_schema_is_v19",
              1,
          )

          s = s.replace(
              "scanner.SCHEMA_VERSION, 18",
              "scanner.SCHEMA_VERSION, 19",
              1,
          )

          p.write_text(
              s,
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m py_compile scanner.py
          python -m unittest discover -v
          git diff --check

      - name: Recalculate 2026-10-07 close
        run: |
          python scanner.py scan \
            --session close \
            --target-date 2026-10-07

      - name: Verify v19 close
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          attempt_path = Path(
              "results/diagnostics/2026-10-07_close_attempt.json"
          )

          attempt = json.loads(
              attempt_path.read_text(
                  encoding="utf-8"
              )
          )

          assert attempt["schema_version"] == 19
          assert attempt["write_status"] == "accepted"
          assert attempt["safety_gate_errors"] == []

          assert (
              attempt["coverage"]["price_source_mode"]
              == "confirmed_daily_close"
          )

          latest = json.loads(
              Path("results/latest_close.json").read_text(
                  encoding="utf-8"
              )
          )

          assert latest["schema_version"] == 19
          assert latest["target_date"] == "2026-10-07"
          assert latest["session"] == "close"
          assert latest["write_status"] == "accepted"
          assert latest["safety_gate_errors"] == []

          print("v19 close verification passed")
          print("counts =", latest["counts"])
          print("coverage =", latest["coverage"])
          PY

      - name: Commit v19 and refreshed close results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/apply_v19.yml

          git add \
            scanner.py \
            test_v14_screening.py \
            data/universe_top1000.csv \
            results/

          git commit \
            -m "Use confirmed daily close for same-day scans"

          git push
