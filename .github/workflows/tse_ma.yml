name: TSE MA Scanner

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 01:35 UTC = 10:35 JST (10:30スナップショットの5分後)
    - cron: "35 1 * * 1-5"
    # 02:05 UTC = 11:05 JST (午前版の再取得。12時までの完成率を高める)
    - cron: "5 2 * * 1-5"
    # 06:40 UTC = 15:40 JST (大引け15:30の10分後)
    - cron: "40 6 * * 1-5"
    # 07:40 UTC = 16:40 JST (終値5分足の配信遅延時の再取得。18時までに完成)
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "実行する判定"
        required: true
        type: choice
        options:
          - noon
          - close
      target_date:
        description: "対象日（任意、YYYY-MM-DD。空欄は当日のJST日付）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tse-ma-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # v14ではTDnet進捗率比較などが増え、全銘柄走査が60分近くになる場合がある。
    # 結果保存直後に上限超過扱いとなるのを防ぐため、余裕を持たせる。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          elif [ "${{ github.event.schedule }}" = "35 1 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "5 2 * * 1-5" ]; then
            SESSION="noon"
          else
            SESSION="close"
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"

      - name: Run scanner
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_ARGS=()
          if [ -n "$TARGET_DATE" ]; then
            TARGET_ARGS=(--target-date "$TARGET_DATE")
          fi
          python scanner.py scan --session "$SESSION" "${TARGET_ARGS[@]}"

      - name: Save results to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_top1000.csv results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update TSE MA results (${SESSION})"

          # The short-scanner workflow can update main while this long scan is running.
          # Rebase the generated-results commit and retry instead of losing the run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Results pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after remote refresh."
            sleep $((attempt * 5))
          done

          echo "Failed to push results after 5 attempts." >&2
          exit 1

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: tse-ma-${{ steps.session.outputs.session }}-${{ github.run_id }}
          path: |
            data/universe_top1000.csv
            results/latest_${{ steps.session.outputs.session }}.json
          retention-days: 14
