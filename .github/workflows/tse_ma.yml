name: TSE MA Scanner

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 01:35 UTC = 10:35 JST (10:30スナップショットの5分後)
    - cron: "35 1 * * 1-5"
    # 02:05 UTC = 11:05 JST (午前版の再取得。12時までの完成率を高める)
    - cron: "5 2 * * 1-5"
    # 06:40 UTC = 15:40 JST (大引け15:30の10分後)
    - cron: "40 6 * * 1-5"
    # 07:40 UTC = 16:40 JST (終値5分足の配信遅延時の再取得。18時までに完成)
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "実行する判定"
        required: true
        type: choice
        options:
          - noon
          - close
      target_date:
        description: "対象日（任意、YYYY-MM-DD。空欄は当日のJST日付）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tse-ma-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # v14ではTDnet進捗率比較などが増え、全銘柄走査が60分近くになる場合がある。
    # 結果保存直後に上限超過扱いとなるのを防ぐため、余裕を持たせる。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Buy audit regression tests
        run: python -m unittest -q test_buy_day_audit.py

      - name: Select session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          elif [ "${{ github.event.schedule }}" = "35 1 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "5 2 * * 1-5" ]; then
            SESSION="noon"
          else
            SESSION="close"
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"

      - name: Run scanner
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_ARGS=()
          if [ -n "$TARGET_DATE" ]; then
            TARGET_ARGS=(--target-date "$TARGET_DATE")
          fi
          python scanner.py scan --session "$SESSION" "${TARGET_ARGS[@]}"

      - name: Save results to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Compare with the current remote state before committing. A manual
          # backfill or an older queued run must not replace a newer official JSON.
          git fetch origin main
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          session = os.environ["SESSION"]
          latest = pathlib.Path("results") / f"latest_{session}.json"
          candidate = json.loads(latest.read_text())
          target_date = candidate.get("target_date") or ""
          generated_at = candidate.get("generated_at_jst") or ""

          if candidate.get("write_status") != "accepted":
              raise RuntimeError("Only accepted results may be saved as official JSON")
          if candidate.get("safety_gate_errors"):
              raise RuntimeError("Safety gate errors prevent saving official JSON")

          candidate_version = (target_date, generated_at)
          protected = [
              latest,
              pathlib.Path("results/diagnostics") / f"latest_{session}_attempt.json",
              pathlib.Path("results/archive") / f"{target_date}_{session}.json",
              pathlib.Path("results/diagnostics") / f"{target_date}_{session}_attempt.json",
          ]

          for path in protected:
              shown = subprocess.run(
                  ["git", "show", f"origin/main:{path.as_posix()}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if shown.returncode != 0:
                  continue
              try:
                  remote = json.loads(shown.stdout)
              except json.JSONDecodeError as exc:
                  raise RuntimeError(f"Remote JSON is invalid: {path}") from exc
              remote_version = (
                  remote.get("target_date") or "",
                  remote.get("generated_at_jst") or "",
              )
              if remote_version > candidate_version:
                  subprocess.run(
                      ["git", "checkout", "origin/main", "--", path.as_posix()],
                      check=True,
                  )
                  print(f"Kept newer remote result: {path} {remote_version}")
          PY

          git add data/universe_top1000.csv results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update TSE MA results (${SESSION})"

          # Another workflow (for example, the short scanner) can update main
          # after checkout. Rebase and retry instead of losing this accepted run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying (${attempt}/5)."
            sleep $((attempt * 2))
          done
          echo "Failed to save results after 5 push attempts." >&2
          exit 1

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: tse-ma-${{ steps.session.outputs.session }}-${{ github.run_id }}
          path: |
            data/universe_top1000.csv
            results/latest_${{ steps.session.outputs.session }}.json
          retention-days: 14
