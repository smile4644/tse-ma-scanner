name: Apply v18 close one-minute bars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply verified v18 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected match count in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once("scanner.py", "SCHEMA_VERSION = 17", "SCHEMA_VERSION = 18")
          replace_once(
              "scanner.py",
              '''# latest_noon.jsonは維持する。closeは15:30確定値を必須とする。
          INTRADAY_SESSION_TIMES = {
              "noon": {
                  "cutoff": dtime(10, 30),
                  "expected_minimum": dtime(10, 25),
              },
              "close": {
                  "cutoff": dtime(15, 30),
                  "expected_minimum": dtime(15, 25),
              },
          }''',
              '''# latest_noon.jsonは維持する。v18ではcloseのみ1分足を使い、
          # 15:25～15:30のクロージング・オークションを含む終値を必須とする。
          INTRADAY_SESSION_TIMES = {
              "noon": {
                  "cutoff": dtime(10, 30),
                  "expected_minimum": dtime(10, 25),
                  "interval": "5m",
              },
              "close": {
                  "cutoff": dtime(15, 30),
                  "expected_minimum": dtime(15, 29),
                  "interval": "1m",
              },
          }''',
          )
          replace_once(
              "scanner.py",
              '            interval="5m",',
              '            interval=INTRADAY_SESSION_TIMES[session]["interval"],',
          )
          replace_once(
              "test_target_date.py",
              '''        self.assertEqual(bar["expected_minimum_time"], "15:25")
                  self.assertIn("2026-10-02T15:30:00+09:00", bar["last_bar"])''',
              '''        self.assertEqual(bar["expected_minimum_time"], "15:29")
                  self.assertIn("2026-10-02T15:30:00+09:00", bar["last_bar"])

              def test_session_intervals_keep_noon_light_and_close_exact(self):
                  self.assertEqual(scanner.INTRADAY_SESSION_TIMES["noon"]["interval"], "5m")
                  self.assertEqual(scanner.INTRADAY_SESSION_TIMES["close"]["interval"], "1m")''',
          )
          replace_once(
              "test_v14_screening.py",
              '''    def test_schema_is_v17(self):
                  self.assertEqual(scanner.SCHEMA_VERSION, 17)''',
              '''    def test_schema_is_v18(self):
                  self.assertEqual(scanner.SCHEMA_VERSION, 18)''',
          )
          PY
          rm .github/workflows/apply_v18.yml
      - name: Verify
        run: |
          python -m unittest -v
          python -m py_compile scanner.py
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner.py test_target_date.py test_v14_screening.py .github/workflows/apply_v18.yml
          git commit -m "Use one-minute bars for confirmed close scan"
          git push
