name: TSE Short Evidence CI

on:
  push:
    paths:
      - 'short_evidence_collect.py'
      - 'test_short_evidence_collect.py'
      - 'short_trade_safety.py'
      - 'test_short_trade_safety.py'
      - '.github/workflows/tse_ma_short.yml'
      - '.github/workflows/short_evidence_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source syntax
        run: python -m py_compile short_trade_safety.py short_evidence_collect.py
      - name: Risk evidence and execution safety tests
        run: python -m unittest -q test_short_trade_safety.py test_short_evidence_collect.py
      - name: Official public-source ingestion smoke check (no publish)
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          doc = json.loads(Path('results/latest_short_close.json').read_text())
          target = doc['target_date']
          subprocess.run(['python', 'short_evidence_collect.py', '--session', 'close',
                          '--target-date', target], check=True)
          print(Path(f'results/short_evidence/{target}_close_status.json').read_text())
          PY
      - name: Preserve dated safety review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tse-short-evidence-${{ github.run_id }}
          path: |
            results/short_evidence/*_close_review.csv
            results/short_evidence/*_close_status.json
            results/short_evidence/*_checks_close.csv
          retention-days: 14
