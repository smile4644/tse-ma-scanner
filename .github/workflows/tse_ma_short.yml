name: TSE MA Short Scanner

on:
  # 実運用: 買いスキャナーの正常終了後に、同じ入力を使って空売り版を生成。
  workflow_run:
    workflows: ["TSE MA Scanner"]
    types: [completed]
  # 手動再実行: 過去日も指定可能。
  workflow_dispatch:
    inputs:
      session:
        description: "noon（10:30）またはclose（15:30）"
        required: true
        type: choice
        options: [noon, close]
      target_date:
        description: "対象日 YYYY-MM-DD（空欄は日本時間の当日）"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: tse-ma-short-scanner
  cancel-in-progress: false

jobs:
  short_scan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Short regression tests
        run: python -m unittest -q test_short_scanner.py test_short_eps_guard.py test_short_trade_safety.py test_short_evidence_collect.py
      - name: Read the upstream result artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: tse-ma-*-${{ github.event.workflow_run.id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: upstream
      - name: Select and validate target source
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, date, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ['GITHUB_EVENT_NAME']
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          root = pathlib.Path('results')
          run, reason = False, ''
          session, target = None, None
          if event_name == 'workflow_run':
              artifacts = list(pathlib.Path('upstream/results').glob('latest_*.json'))
              if len(artifacts) != 1:
                  reason = f'Expected one upstream result artifact, found {len(artifacts)}'
              else:
                  upstream = json.loads(artifacts[0].read_text())
                  session = upstream.get('session')
                  target = upstream.get('target_date')
                  started_str = (event['workflow_run'].get('run_started_at')
                                 or event['workflow_run']['created_at'])
                  started = datetime.fromisoformat(started_str.replace('Z', '+00:00'))
                  generated = datetime.fromisoformat(upstream['generated_at_jst'])
                  if upstream.get('write_status') != 'accepted':
                      reason = 'Upstream artifact blocked'
                  elif generated < started - timedelta(minutes=2):
                      reason = 'Stale upstream result; the latest file was not regenerated by this run'
                  elif target != started.astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat():
                      reason = 'Upstream date differs from the current scan day; use manual backfill'
                  else:
                      archive = root / 'archive' / f'{target}_{session}.json'
                      if not archive.exists():
                          reason = f'Missing upstream archive: {archive}'
                      elif json.loads(archive.read_text()).get('generated_at_jst') != upstream.get('generated_at_jst'):
                          reason = 'Upstream archive has changed since this run; skip outdated run'
                      else:
                          run = True
          elif event_name == 'workflow_dispatch':
              session = event['inputs']['session']
              target = (event['inputs'].get('target_date')
                        or datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat())
              date.fromisoformat(target)
              run = True
          else:
              raise ValueError(f'Unexpected workflow event: {event_name}')

          if run:
              if session not in ('noon', 'close'):
                  raise ValueError(f'Unsupported session: {session}')
              source_path = root / 'archive' / f'{target}_{session}.json'
              if not source_path.exists():
                  raise FileNotFoundError(f'No accepted archive at {source_path}')
              source = json.loads(source_path.read_text())
              if source.get('write_status') != 'accepted' or source.get('safety_gate_errors'):
                  raise RuntimeError('Source scan did not pass its safety gate')
              if source.get('session') != session or source.get('target_date') != target:
                  raise RuntimeError('Source session/date mismatch')
          else:
              print(f'Safely skipped: {reason}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'run={str(run).lower()}\n')
              if run:
                  out.write(f'session={session}\ntarget_date={target}\n')
          PY
      - name: Run short scanner and check result
        if: ${{ steps.source.outputs.run == 'true' }}
        shell: bash
        env:
          SESSION: ${{ steps.source.outputs.session }}
          TARGET_DATE: ${{ steps.source.outputs.target_date }}
        run: |
          mkdir -p "$RUNNER_TEMP/short_backup"
          if [ -f "results/latest_short_${SESSION}.json" ]; then
            cp "results/latest_short_${SESSION}.json" "$RUNNER_TEMP/short_backup/latest.json"
          fi
          python short_scanner.py --session "$SESSION" --target-date "$TARGET_DATE"
          python short_eps_guard.py --session "$SESSION" --target-date "$TARGET_DATE" --overwrite
          # JSF public data is advisory. Unverified broker/issuer/exchange fields stay blank.
          python short_evidence_collect.py --session "$SESSION" --target-date "$TARGET_DATE"
          python short_trade_safety.py --session "$SESSION" --target-date "$TARGET_DATE" --checks-path "results/short_evidence/${TARGET_DATE}_checks_${SESSION}.csv"
          python - <<'PY'
          import json, os, pathlib, shutil
          path = pathlib.Path('results') / f"latest_short_{os.environ['SESSION']}.json"
          archive = pathlib.Path('results/short_archive') / f"{os.environ['TARGET_DATE']}_{os.environ['SESSION']}.json"
          current = json.loads(archive.read_text())
          if current['target_date'] != os.environ['TARGET_DATE']:
              raise RuntimeError('Incorrect short target date')
          gate = current.get('trade_safety_gate') or {}
          if gate.get('version') != 3 or gate.get('target_date') != current['target_date']:
              raise RuntimeError('Missing or outdated short trade safety gate')
          groups = (
              'short_9_of_9_candidates', 'near_short_9_of_9_candidates',
              'short_8_of_9_candidates', 'short_7_of_9_candidates',
              'all_ma_below_candidates', 'near_all_ma_below_candidates',
              'near_all_ma_below_price_candidates',
              'near_all_ma_below_touch_candidates',
          )
          unique = {}
          for group in groups:
              candidates = current.get(group)
              if not isinstance(candidates, list):
                  raise RuntimeError(f'Missing short research group: {group}')
              for candidate in candidates:
                  safety = candidate.get('trade_safety')
                  if not isinstance(safety, dict) or safety.get('status') not in (
                          'eligible', 'excluded', 'verification_required'):
                      raise RuntimeError(f'Missing short safety decision: {group}')
                  if safety.get('order_ready') != (safety['status'] == 'eligible'):
                      raise RuntimeError(f'Inconsistent short order readiness: {group}')
                  unique[str(candidate['code'])] = safety['status']
          if gate.get('unique_candidates') != len(unique):
              raise RuntimeError('Short safety coverage mismatch')
          expected_counts = {
              status: list(unique.values()).count(status)
              for status in ('eligible', 'excluded', 'verification_required')
          }
          if gate.get('counts') != expected_counts:
              raise RuntimeError('Short safety status counts mismatch')
          coverage = current['screening_summary']['fundamental']
          if coverage.get('requested', 0) and coverage.get('available_ratio', 0) < 0.5:
              raise RuntimeError('Short EPS coverage is below 50%: no unreliable results will be committed')
          backup = pathlib.Path(os.environ['RUNNER_TEMP']) / 'short_backup/latest.json'
          if backup.exists():
              old = json.loads(backup.read_text())
              # Protect current latest files when reprocessing older dates/runs.
              old_version = (old.get('target_date') or '', old.get('source_generated_at_jst') or '')
              new_version = (current.get('target_date') or '', current.get('source_generated_at_jst') or '')
              if old_version > new_version:
                  shutil.copy2(backup, path)
                  print('Historical run: kept the newer latest_short file')
          print('Short candidate counts:', json.dumps(current['counts'], ensure_ascii=False))
          PY
      - name: Commit short results
        if: ${{ steps.source.outputs.run == 'true' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Protect the newest published result against a delayed re-run.
          git fetch origin main
          python - <<'PY'
          import json, os, pathlib, subprocess
          session = '${{ steps.source.outputs.session }}'
          latest = pathlib.Path('results') / f'latest_short_{session}.json'
          remote = subprocess.run(
              ['git', 'show', f'origin/main:{latest.as_posix()}'],
              capture_output=True, text=True, check=False,
          )
          if remote.returncode == 0:
              try:
                  old = json.loads(remote.stdout)
              except json.JSONDecodeError as exc:
                  raise RuntimeError('Invalid remote short JSON') from exc
              new = json.loads(latest.read_text())
              version = lambda d: (
                  d.get('target_date') or '',
                  d.get('source_generated_at_jst') or '',
              )
              if version(old) > version(new):
                  subprocess.run(
                      ['git', 'checkout', 'origin/main', '--', latest.as_posix()],
                      check=True,
                  )
                  print('Protected newer remote short result')
          PY
          git add results/latest_short_*.json results/short_archive/ results/short_fundamental_eps_cache.json results/short_research/ results/short_evidence/
          if git diff --cached --quiet; then
            echo 'No changed short results.'
          else
            git commit -m "Update TSE short results (${{ steps.source.outputs.target_date }} ${{ steps.source.outputs.session }})"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Short result push raced with another workflow (${attempt}/5)."
              sleep $((attempt * 2))
            done
            echo "Failed to save short results after 5 push attempts." >&2
            exit 1
          fi
      - name: Upload short results
        if: ${{ steps.source.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tse-ma-short-${{ steps.source.outputs.session }}-${{ github.run_id }}
          path: |
            results/latest_short_${{ steps.source.outputs.session }}.json
            results/short_archive/${{ steps.source.outputs.target_date }}_${{ steps.source.outputs.session }}.json
            results/short_research/${{ steps.source.outputs.target_date }}_${{ steps.source.outputs.session }}_review.csv
            results/short_evidence/${{ steps.source.outputs.target_date }}_${{ steps.source.outputs.session }}_review.csv
            results/short_evidence/${{ steps.source.outputs.target_date }}_${{ steps.source.outputs.session }}_status.json
            results/short_evidence/${{ steps.source.outputs.target_date }}_checks_${{ steps.source.outputs.session }}.csv
          retention-days: 14

